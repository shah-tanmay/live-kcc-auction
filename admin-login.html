<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KCC Season 5 - Admin Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2460d",
                        "secondary": "#1e293b",
                        "background-light": "#f8fafc",
                        "surface-light": "#ffffff",
                        "border-light": "#e2e8f0",
                        "text-main": "#0f172a",
                        "text-subtle": "#64748b"
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "sans": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "soft": "0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)",
                        "card": "0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025)"
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-background-light text-text-main flex flex-col h-screen overflow-hidden font-display selection:bg-primary/20 selection:text-primary items-center justify-center relative">
<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-orange-100 rounded-full blur-[120px] opacity-60"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-blue-50 rounded-full blur-[120px] opacity-60"></div>
</div>
<main class="w-full max-w-[440px] px-6">
<div class="bg-surface-light rounded-3xl shadow-card border border-white/60 backdrop-blur-xl p-8 sm:p-10 relative overflow-hidden ring-1 ring-slate-900/5">
<div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary to-orange-500"></div>
<div class="flex flex-col items-center gap-5 mb-10">
<div class="size-16 bg-gradient-to-br from-primary to-orange-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-primary/30 ring-4 ring-orange-50 transform hover:scale-105 transition-transform duration-300">
<span class="font-bold text-3xl tracking-tighter">KCC</span>
</div>
<div class="text-center">
<h1 class="text-2xl font-bold tracking-tight text-secondary">Admin Portal</h1>
<p class="text-text-subtle text-sm mt-1 font-medium">Season 5 Auction Management</p>
</div>
</div>
<form action="#" class="space-y-6" method="POST">
<div class="space-y-1.5">
<label class="text-xs font-bold text-secondary uppercase tracking-wider ml-1" for="email">Username or Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">person</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-secondary placeholder-slate-400 focus:outline-none focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm" id="email" name="email" placeholder="admin@kcc-auction.com" required="" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex items-center justify-between ml-1">
<label class="text-xs font-bold text-secondary uppercase tracking-wider" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-orange-700 transition-colors" href="#">Recovery?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
</div>
<input class="block w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-secondary placeholder-slate-400 focus:outline-none focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-secondary cursor-pointer transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full group flex items-center justify-center gap-2 bg-gradient-to-r from-primary to-orange-600 hover:from-orange-600 hover:to-primary text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-primary/25 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200" type="submit">
<span>Login to Dashboard</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 pt-6 border-t border-slate-100 flex flex-col items-center gap-4">
<a class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
                    Back to Tournament Site
                </a>
</div>
</div>
<div class="mt-8 text-center space-y-2">
<p class="text-xs text-slate-400 font-medium">
                © 2024 KCC Tournament Auction.
            </p>
<div class="flex items-center justify-center gap-2 text-[10px] text-slate-300 uppercase tracking-widest font-bold">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">lock</span> Secure</span>
<span>•</span>
<span>Restricted</span>
</div>
</div>
</main>

</body></html>
